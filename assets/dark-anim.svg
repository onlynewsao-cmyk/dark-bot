<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" font-family="monospace">
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b14aed"/>
      <stop offset=".5" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#ff2e88"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="bg" cx=".5" cy=".5" r=".8">
      <stop offset="0" stop-color="#12041f"/>
      <stop offset="1" stop-color="#050208"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <!-- grid -->
  <g stroke="#b14aed" stroke-opacity=".12">
    <path d="M0 80H1200M0 160H1200M0 240H1200M200 0V320M400 0V320M600 0V320M800 0V320M1000 0V320"/>
  </g>

  <!-- partículas -->
  <g fill="#00f0ff">
    <circle cx="120" cy="250" r="3"><animate attributeName="cy" values="250;90;250" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;1;.2" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="90" r="2"><animate attributeName="cy" values="90;260;90" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.2;1" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="240" r="3" fill="#ff2e88"><animate attributeName="cy" values="240;80;240" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values=".3;1;.3" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="1060" cy="100" r="2" fill="#b14aed"><animate attributeName="cy" values="100;270;100" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.25;1" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="600" cy="280" r="2.5" fill="#00ff9d"><animate attributeName="cx" values="500;700;500" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values=".3;1;.3" dur="10s" repeatCount="indefinite"/></circle>
  </g>

  <!-- título com brilho pulsante -->
  <g filter="url(#glow)" text-anchor="middle">
    <text x="600" y="140" font-size="84" font-weight="bold" fill="url(#sweep)" letter-spacing="6">DARK BOT
      <animate attributeName="opacity" values="1;.75;1" dur="3s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- subtítulos que alternam -->
  <g font-size="26" text-anchor="middle" fill="#00ff9d">
    <text x="600" y="195" opacity="0">☠️ IA VIVA · MÍDIA REAL · RPG · MODERAÇÃO
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.4;.5" dur="10s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="195" opacity="0">🎵 1600+ COMANDOS · DASHBOARD · AURA
      <animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;.45;.5;.55;.65;.95;1" dur="10s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- pill versão -->
  <g>
    <rect x="525" y="222" width="150" height="40" rx="20" fill="none" stroke="#ff2e88" stroke-width="2">
      <animate attributeName="stroke-opacity" values="1;.4;1" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="600" y="250" font-size="22" text-anchor="middle" fill="#ff2e88">◉ v7.55 ONLINE</text>
  </g>

  <!-- scanline -->
  <rect x="0" y="0" width="1200" height="6" fill="#00f0ff" opacity=".35">
    <animate attributeName="y" values="-10;320" dur="5s" repeatCount="indefinite"/>
  </rect>
  <!-- cursor -->
  <rect x="1120" y="270" width="16" height="28" fill="#00ff9d">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
  <text x="1112" y="292" font-size="22" text-anchor="end" fill="#00ff9d" opacity=".8">dark@bot:~$</text>
</svg>
